[package]
name = "api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
config.workspace = true
dotenvy.workspace = true
reqwest.workspace = true

# Web framework
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# GraphQL
async-graphql.workspace = true
async-graphql-axum.workspace = true
async-trait.workspace = true

# Database clients
neo4rs.workspace = true
qdrant-client.workspace = true

# Kafka consumer for subscriptions
rdkafka.workspace = true

# Semver for CVE range matching
semver = "1.0"

# Rate limiting
governor.workspace = true
tower_governor = "0.5"

# Redis caching
redis.workspace = true

# Streams and futures
tokio-stream = { workspace = true, features = ["sync", "time"] }
futures.workspace = true
base64.workspace = true

models = { path = "../../packages/models" }
storage = { path = "../../packages/storage" }

# JWT Auth
jsonwebtoken = "9.2"

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# PostgreSQL for audit logging
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

