[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full", "test-util"] }

# Testcontainers for integration testing
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "postgres", "redis"] }

# HTTP client for API testing
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Assertions
assert_matches = "1.5"
pretty_assertions = "1.4"

# Kafka
rdkafka = { version = "0.39", features = ["cmake-build"] }

# Database clients
neo4rs = "0.8"
qdrant-client = "1.17"
sqlx.workspace = true

# GraphQL client
graphql_client = "0.14"

# Tracing for test output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"

# Stream utilities (used by rdkafka consumer.stream().next())
futures-util = "0.3"
