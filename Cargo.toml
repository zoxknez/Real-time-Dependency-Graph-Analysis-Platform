[workspace]
resolver = "2"
members = [
    "apps/ingestion",
    "apps/analysis",
    "apps/graph-writer",
    "apps/vector-writer",
    "apps/syncer",
    "apps/api",
    "packages/models",
    "packages/storage",
    "packages/metrics",
    "packages/tracing",
    "tests"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Inverse Dependencies Team"]
license = "MIT"
repository = "https://github.com/inverse-deps/platform"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.52", features = ["full"] }

# Kafka/Redpanda
rdkafka = { version = "0.39", features = ["cmake-build"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Protobuf & gRPC
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tonic = "0.14"
tonic-build = "0.14"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "native-tls", "gzip"], default-features = false }

# Web Framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit"] }

# GraphQL
async-graphql = { version = "7.2", features = ["log", "dataloader"] }
async-graphql-axum = "7.2"

# Singleflight for cache stampede protection
singleflight-async = "0.2"

# Database Clients
neo4rs = "0.8"            # Memgraph (Bolt protocol)
qdrant-client = "1.17"    # Qdrant Vector DB
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }

# Tracing & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry", "fmt"] }
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
tracing-opentelemetry = "0.32"

# Utilities
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dotenvy = "0.15"
dashmap = "6.0"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
async-trait = "0.1"
governor = "0.7"
base64 = "0.22"
tokio-stream = "0.1"
futures = "0.3"

# Redis
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# Tree-sitter (AST parsing)
tree-sitter = "0.26"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"

# ML/Embeddings
rust-bert = "0.22"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.docker]
inherits = "release"
lto = false
codegen-units = 16
strip = true

[profile.dev]
opt-level = 0
debug = true
