# Docker Compose for IDP Application Services
# Use alongside main docker-compose.yml: docker-compose -f docker-compose.yml -f docker-compose.apps.yml up

x-logging-defaults: &logging_defaults
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
services:
  # ═══════════════════════════════════════════════════════════════
  # API SERVICE - GraphQL Gateway
  # ═══════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: idp-api
    ports:
      - "127.0.0.1:${IDP_API_PORT:-8002}:8080"
    environment:
      # Server
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - RUST_LOG=info
      
      # Memgraph
      - MEMGRAPH_URI=bolt://memgraph:7687
      
      # Redis
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECS=300
      
      # Kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=domain.package.events.v1

      # PostgreSQL (audit)
      - DATABASE_URL=postgres://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp_secret}@postgres:5432/${POSTGRES_DB:-inverse_deps}

      # Semantic search (Qdrant + embeddings)
      - QDRANT_ENABLED=true
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_COLLECTION=package_embeddings
      - QDRANT_DIMENSION=384
      - EMBEDDING_PROVIDER=mock
      - EMBEDDING_DIMENSION=384
      
      # Guardrails
      - RATE_LIMIT_RPM=100
      - MAX_TRAVERSAL_DEPTH=5
      - MAX_PATH_HOPS=10
      - MAX_RESULTS=200
      - MAX_COMPLEXITY=1000
      
      # JWT (optional)
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      
      # Tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      memgraph:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging_defaults
    networks:
      - default
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND - Next.js Dashboard
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_GRAPHQL_ENDPOINT=${PUBLIC_GRAPHQL_ENDPOINT:-http://localhost:8002/graphql}
        - NEXT_PUBLIC_WS_ENDPOINT=${PUBLIC_WS_ENDPOINT:-ws://localhost:8002/graphql/ws}
        - NEXT_PUBLIC_AGENT_STREAM_ENDPOINT=${PUBLIC_AGENT_STREAM_ENDPOINT:-http://localhost:8002/agent/stream}
        - NEXT_PUBLIC_SEARCH_MODE=${PUBLIC_SEARCH_MODE:-semantic}
    container_name: idp-frontend
    ports:
      - "127.0.0.1:${IDP_FRONTEND_PORT:-3003}:3000"
    environment:
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=${PUBLIC_GRAPHQL_ENDPOINT:-http://localhost:8002/graphql}
      - NEXT_PUBLIC_WS_ENDPOINT=${PUBLIC_WS_ENDPOINT:-ws://localhost:8002/graphql/ws}
      - NEXT_PUBLIC_AGENT_STREAM_ENDPOINT=${PUBLIC_AGENT_STREAM_ENDPOINT:-http://localhost:8002/agent/stream}
      - NEXT_PUBLIC_SEARCH_MODE=${PUBLIC_SEARCH_MODE:-semantic}
      - NODE_ENV=production
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging_defaults
    networks:
      - default
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ═══════════════════════════════════════════════════════════════
  # INGESTION SERVICE - Registry Crawlers
  # ═══════════════════════════════════════════════════════════════
  ingestion:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ingestion
    container_name: idp-ingestion
    environment:
      - RUST_LOG=info
      
      # Kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=domain.package.events.v1
      
      # PostgreSQL (outbox)
      - DATABASE_URL=postgres://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp_secret}@postgres:5432/${POSTGRES_DB:-inverse_deps}
      
      # Registry crawl intervals (seconds)
      - NPM_CRAWL_INTERVAL=300
      - PYPI_CRAWL_INTERVAL=300
      - CARGO_CRAWL_INTERVAL=300
      
      # Tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging_defaults
    networks:
      - default
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # ANALYSIS SERVICE - AST Parsing & Breaking Change Detection
  # ═══════════════════════════════════════════════════════════════
  analysis:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.analysis
    container_name: idp-analysis
    environment:
      - RUST_LOG=info
      
      # Kafka
      - ANALYSIS__KAFKA__BROKERS=redpanda:9092
      - ANALYSIS__KAFKA__INPUT_TOPIC=domain.package.events.v1
      - ANALYSIS__KAFKA__OUTPUT_TOPIC=domain.analysis.events.v1
      - ANALYSIS__KAFKA__CONSUMER_GROUP=analysis-service-cg
      
      # Workers
      - ANALYSIS__WORKERS__COUNT=4
      - ANALYSIS__WORKERS__PARSE_TIMEOUT_SECS=30

      # Package analysis safety limits
      - ANALYSIS__PARSER__MAX_FILE_SIZE=1048576
      - ANALYSIS__PARSER__MAX_FILES_PER_PACKAGE=1000
      - ANALYSIS__PARSER__MAX_TARBALL_SIZE_BYTES=67108864
      - ANALYSIS__PARSER__MAX_UNPACKED_SIZE_BYTES=209715200
      - ANALYSIS__PARSER__SNAPSHOT_MAX_BYTES=5242880
      - ANALYSIS__PARSER__SNAPSHOT_VERSIONS_PER_PACKAGE=20
      - ANALYSIS__PARSER__SNAPSHOT_TOTAL_MAX_BYTES=268435456
      
      # Health/metrics
      - ANALYSIS__SERVICE__METRICS_ENABLED=true
      - ANALYSIS__SERVICE__METRICS_PORT=9091
      
      # Embeddings
      - ANALYSIS__EMBEDDING__PROVIDER=mock
      - ANALYSIS__EMBEDDING__MODEL_PATH=/models/minilm
      
      # Tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    volumes:
      - ./models:/models:ro
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging_defaults
    networks:
      - default
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "${IDP_ANALYSIS_CPUS:-1}"
          memory: ${IDP_ANALYSIS_MEMORY_LIMIT:-768M}

  # ═══════════════════════════════════════════════════════════════
  # GRAPH WRITER - Memgraph Writer
  # ═══════════════════════════════════════════════════════════════
  graph-writer:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.graph-writer
    container_name: idp-graph-writer
    environment:
      - RUST_LOG=info
      
      # Kafka
      - GRAPH_WRITER__KAFKA__BROKERS=redpanda:9092
      - GRAPH_WRITER__KAFKA__TOPIC=domain.package.events.v1
      - GRAPH_WRITER__KAFKA__GROUP_ID=graph-writer-cg
      
      # Memgraph
      - GRAPH_WRITER__MEMGRAPH__URI=bolt://memgraph:7687
      
      # Tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      memgraph:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging_defaults
    networks:
      - default
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # VECTOR WRITER - Qdrant Writer
  # ═══════════════════════════════════════════════════════════════
  vector-writer:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.vector-writer
    container_name: idp-vector-writer
    environment:
      - RUST_LOG=info
      
      # Kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=domain.analysis.events.v1
      - KAFKA_GROUP_ID=vector-writer-cg
      
      # Qdrant
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_COLLECTION=package_embeddings
      - QDRANT_DIMENSION=384
      
      # Batch settings
      - BATCH_SIZE=100
      
      # Tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - HEALTH_PORT=9092
    depends_on:
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging_defaults
    networks:
      - default
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ═══════════════════════════════════════════════════════════════
  # SYNCER - Multi-store Sync
  # ═══════════════════════════════════════════════════════════════
  syncer:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.syncer
    container_name: idp-syncer
    environment:
      - RUST_LOG=info,sqlx::query=error
      
      # RisingWave
      - RISINGWAVE_URL=postgres://root@risingwave:4566/dev
      
      # Memgraph
      - MEMGRAPH_URL=bolt://memgraph:7687
      
      # Qdrant
      - QDRANT_URL=http://qdrant:6334
      
      # Sync interval
      - SYNC_INTERVAL_SECS=60
      
      # Tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - HEALTH_PORT=9093
    depends_on:
      risingwave:
        condition: service_healthy
      memgraph:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging_defaults
    networks:
      - default
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

networks:
  default:
    name: idp-network
