# Rustfmt configuration.
# Keep this file stable-compatible so `cargo fmt --check` is quiet on the
# default toolchain used by local development and CI.

edition = "2024"
max_width = 100
tab_spaces = 4
newline_style = "Auto"
use_small_heuristics = "Default"

reorder_imports = true
reorder_modules = true

fn_params_layout = "Tall"

use_field_init_shorthand = true
use_try_shorthand = true
