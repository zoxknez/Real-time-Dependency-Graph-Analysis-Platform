services:
  # ═══════════════════════════════════════════════════════════════
  # 1. MESSAGING BACKBONE - Redpanda v25.3.4 (Kafka-compatible)
  # ═══════════════════════════════════════════════════════════════
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.4
    container_name: idp-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092" # Kafka API
      - "18082:18082" # Pandaproxy (REST)
      - "18081:18081" # Schema Registry
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.0.0
    container_name: idp-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_SCHEMAREGISTRY_ENABLED=true
      - KAFKA_SCHEMAREGISTRY_URLS=http://redpanda:8081

  # ═══════════════════════════════════════════════════════════════
  # 2. STREAM PROCESSING - RisingWave v2.7.0 (Streaming SQL)
  # ═══════════════════════════════════════════════════════════════
  risingwave:
    image: risingwavelabs/risingwave:v2.7.0
    container_name: idp-risingwave
    command: risingwave playground
    ports:
      - "4566:4566" # PostgreSQL protocol
      - "5691:5691" # Dashboard
    volumes:
      - risingwave_data:/risingwave
    healthcheck:
      test: [ "CMD", "psql", "-h", "localhost", "-p", "4566", "-U", "root", "-d", "dev", "-c", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # 3. GRAPH DATABASE - Memgraph v3.0 + MAGE 1.18 (Cypher)
  # ═══════════════════════════════════════════════════════════════
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: idp-memgraph
    ports:
      - "7687:7687" # Bolt protocol
      - "7444:7444" # HTTP API
    volumes:
      - memgraph_data:/var/lib/memgraph
      - ./infra/memgraph/queries:/usr/lib/memgraph/query_modules:ro
    environment:
      - MEMGRAPH_QUERY_MODULES_DIRECTORY=/usr/lib/memgraph/query_modules
    healthcheck:
      test: [ "CMD", "echo", ">", "/dev/tcp/localhost/7687" ]
      interval: 10s
      timeout: 5s
      retries: 5

  memgraph-lab:
    image: memgraph/lab:2.14.0
    container_name: idp-memgraph-lab
    depends_on:
      - memgraph
    ports:
      - "3002:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687

  # ═══════════════════════════════════════════════════════════════
  # 4. VECTOR DATABASE - Qdrant v1.16.2
  # ═══════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: idp-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: [ "CMD", "bash", "-lc", "cat < /dev/null > /dev/tcp/127.0.0.1/6333" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # 5. METADATA & AUDIT - PostgreSQL 16
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=idp
      - POSTGRES_PASSWORD=idp_secret
      - POSTGRES_DB=inverse_deps
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U idp -d inverse_deps" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # 6. CACHING - Redis 7
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: idp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # 7. DISTRIBUTED TRACING - Jaeger (OpenTelemetry)
  # ═══════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: idp-jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ═══════════════════════════════════════════════════════════════
  # 8. MONITORING (Optional - use: docker-compose --profile monitoring up)
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: idp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    container_name: idp-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    profiles:
      - monitoring

volumes:
  redpanda_data:
  risingwave_data:
  memgraph_data:
  qdrant_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:


networks:
  default:
    name: idp-network
