name: randomapp

services:
  # ═══════════════════════════════════════════════════════════════
  # 1. MESSAGING BACKBONE - Redpanda v26.1.5 (Kafka-compatible)
  # ═══════════════════════════════════════════════════════════════
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.5
    container_name: idp-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${EXTERNAL_HOST:-localhost}:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://${EXTERNAL_HOST:-localhost}:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "127.0.0.1:${IDP_KAFKA_PORT:-19092}:19092" # Kafka API
      - "127.0.0.1:${IDP_PANDAPROXY_PORT:-18082}:18082" # Pandaproxy (REST)
      - "127.0.0.1:${IDP_SCHEMA_REGISTRY_PORT:-18081}:18081" # Schema Registry
      - "127.0.0.1:${IDP_REDPANDA_ADMIN_PORT:-9644}:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          memory: ${REDPANDA_MEMORY_LIMIT:-1g}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.5
    container_name: idp-redpanda-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    command:
      - topic
      - create
      - --if-not-exists
      - --partitions
      - "1"
      - --replicas
      - "1"
      - raw.npm.changes.v1
      - raw.pypi.journal.v1
      - raw.cargo.index.v1
      - domain.package.events.v1
      - domain.package.upsert.v1
      - domain.package.deleted.v1
      - domain.version.upsert.v1
      - domain.version.yanked.v1
      - domain.analysis.events.v1
      - breaking-changes
      - dependency-impact
      - domain.analysis.dlq.v1
      - graph-writer-dlq
      - vector-writer-dlq
      - -X
      - brokers=redpanda:9092
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.1
    container_name: idp-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IDP_REDPANDA_CONSOLE_PORT:-18080}:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_SCHEMAREGISTRY_ENABLED=true
      - KAFKA_SCHEMAREGISTRY_URLS=http://redpanda:8081
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════
  # 2. STREAM PROCESSING - RisingWave v2.8.1 (Streaming SQL)
  # ═══════════════════════════════════════════════════════════════
  risingwave:
    image: risingwavelabs/risingwave:v2.8.1
    container_name: idp-risingwave
    restart: unless-stopped
    command: playground
    ports:
      - "127.0.0.1:${IDP_RISINGWAVE_SQL_PORT:-4566}:4566" # PostgreSQL protocol
      - "127.0.0.1:${IDP_RISINGWAVE_DASHBOARD_PORT:-5691}:5691" # Dashboard
    volumes:
      - risingwave_data:/risingwave/data
    deploy:
      resources:
        limits:
          memory: ${IDP_RISINGWAVE_MEMORY_LIMIT:-1g}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/4566' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  risingwave-init:
    image: postgres:17.9-alpine
    container_name: idp-risingwave-init
    restart: "no"
    depends_on:
      risingwave:
        condition: service_healthy
    environment:
      - PGHOST=risingwave
      - PGPORT=4566
      - PGUSER=root
      - PGDATABASE=dev
    volumes:
      - ./infra/risingwave/init:/risingwave-init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for file in /risingwave-init/*.sql; do
          psql -v ON_ERROR_STOP=1 -f "$$file"
        done
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ═══════════════════════════════════════════════════════════════
  # 3. GRAPH DATABASE - Memgraph 3.9.0 + MAGE (Cypher)
  # ═══════════════════════════════════════════════════════════════
  memgraph:
    # Memgraph 3.9.0 with MAGE algorithms (pinned for stability)
    image: memgraph/memgraph-mage:3.9.0
    container_name: idp-memgraph
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDP_MEMGRAPH_BOLT_PORT:-7687}:7687" # Bolt protocol
      - "127.0.0.1:${IDP_MEMGRAPH_HTTP_PORT:-7444}:7444" # HTTP API
    volumes:
      - memgraph_data:/var/lib/memgraph
      - ./infra/memgraph/init:/usr/lib/memgraph/init-queries
      - ./infra/memgraph/queries:/usr/lib/memgraph/query_modules:ro
    environment:
      - MEMGRAPH_QUERY_MODULES_DIRECTORY=/usr/lib/memgraph/query_modules
    deploy:
      resources:
        limits:
          memory: ${MEMGRAPH_MEMORY_LIMIT:-1g}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  memgraph-lab:
    image: memgraph/lab:3.9.0
    container_name: idp-memgraph-lab
    restart: unless-stopped
    depends_on:
      - memgraph
    ports:
      - "127.0.0.1:${IDP_MEMGRAPH_LAB_PORT:-3002}:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ═══════════════════════════════════════════════════════════════
  # 4. VECTOR DATABASE - Qdrant v1.17.0
  # ═══════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: idp-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDP_QDRANT_REST_PORT:-6333}:6333" # REST API
      - "127.0.0.1:${IDP_QDRANT_GRPC_PORT:-6334}:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEMORY_LIMIT:-512m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════
  # 5. METADATA & AUDIT - PostgreSQL 17.9
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:17.9-alpine
    container_name: idp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDP_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-idp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-idp_secret}
      - POSTGRES_DB=${POSTGRES_DB:-inverse_deps}
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idp} -d ${POSTGRES_DB:-inverse_deps}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # 6. CACHING - Valkey 8.0 (Redis-compatible, BSD license)
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: valkey/valkey:8.0-alpine
    container_name: idp-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDP_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # 7. DISTRIBUTED TRACING - Jaeger v2 (OpenTelemetry native)
  # ═══════════════════════════════════════════════════════════════
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    container_name: idp-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDP_JAEGER_UI_PORT:-16686}:16686" # UI
      - "127.0.0.1:${IDP_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${IDP_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    # Jaeger v2 has OTLP enabled by default (OpenTelemetry Collector based)
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ═══════════════════════════════════════════════════════════════
  # 8. MONITORING (Optional - use: docker-compose --profile monitoring up)
  # ═══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: idp-prometheus
    ports:
      - "127.0.0.1:${IDP_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:13.0.1
    container_name: idp-grafana
    ports:
      - "127.0.0.1:${IDP_GRAFANA_PORT:-3004}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    profiles:
      - monitoring

volumes:
  redpanda_data:
  risingwave_data:
  memgraph_data:
  qdrant_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:


networks:
  default:
    name: idp-network
