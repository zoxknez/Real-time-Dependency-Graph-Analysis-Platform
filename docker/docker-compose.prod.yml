# ═══════════════════════════════════════════════════════════════
# Docker Compose - Production Services
# ═══════════════════════════════════════════════════════════════
# Usage: docker compose -f docker/docker-compose.prod.yml up -d

x-logging-defaults: &logging_defaults
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ═══════════════════════════════════════════════════════════════
  # API Service
  # ═══════════════════════════════════════════════════════════════
  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    image: realtime3u1/api:latest
    container_name: rt3u1-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Server
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - RUST_LOG=info

      # Memgraph
      - MEMGRAPH_URI=bolt://memgraph:7687

      # Redis
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECS=300

      # Kafka
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=domain.package.events.v1
      - KAFKA_CONSUMER_GROUP=api-subscriptions-cg

      # Semantic search (Qdrant + embeddings)
      - QDRANT_ENABLED=true
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_COLLECTION=package_embeddings
      - QDRANT_DIMENSION=384
      - EMBEDDING_PROVIDER=mock
      - EMBEDDING_DIMENSION=384

      # Guardrails
      - RATE_LIMIT_RPM=100
      - MAX_TRAVERSAL_DEPTH=5
      - MAX_PATH_HOPS=10
      - MAX_RESULTS=200
      - MAX_COMPLEXITY=1000
    depends_on:
      memgraph:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Analysis Service
  # ═══════════════════════════════════════════════════════════════
  analysis:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.analysis
    image: realtime3u1/analysis:latest
    container_name: rt3u1-analysis
    environment:
      - RUST_LOG=info
      - ANALYSIS__KAFKA__BROKERS=redpanda:9092
      - ANALYSIS__KAFKA__INPUT_TOPIC=domain.package.events.v1
      - ANALYSIS__KAFKA__OUTPUT_TOPIC=domain.analysis.events.v1
      - ANALYSIS__KAFKA__CONSUMER_GROUP=analysis-service-cg
      - ANALYSIS__WORKERS__COUNT=4
      - ANALYSIS__WORKERS__PARSE_TIMEOUT_SECS=30
      - ANALYSIS__EMBEDDING__PROVIDER=mock
      - ANALYSIS__SERVICE__METRICS_ENABLED=true
      - ANALYSIS__SERVICE__METRICS_PORT=9091
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/health/ready" ]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Ingestion Service
  # ═══════════════════════════════════════════════════════════════
  ingestion:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.ingestion
    image: realtime3u1/ingestion:latest
    container_name: rt3u1-ingestion
    environment:
      - RUST_LOG=info,ingestion=debug
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=domain.package.events.v1
      - DATABASE_URL=postgres://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp_secret}@postgres:5432/${POSTGRES_DB:-inverse_deps}
      - NPM_CRAWL_INTERVAL=300
      - PYPI_CRAWL_INTERVAL=300
      - CARGO_CRAWL_INTERVAL=300
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9001/health/ready" ]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Graph Writer Service
  # ═══════════════════════════════════════════════════════════════
  graph-writer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.graph-writer
    image: realtime3u1/graph-writer:latest
    container_name: rt3u1-graph-writer
    environment:
      - RUST_LOG=info,graph_writer=debug
      - GRAPH_WRITER__KAFKA__BROKERS=redpanda:9092
      - GRAPH_WRITER__KAFKA__TOPIC=domain.package.events.v1
      - GRAPH_WRITER__KAFKA__GROUP_ID=graph-writer-cg
      - GRAPH_WRITER__MEMGRAPH__URI=bolt://memgraph:7687
    depends_on:
      memgraph:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health/ready" ]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Vector Writer Service
  # ═══════════════════════════════════════════════════════════════
  vector-writer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.vector-writer
    image: realtime3u1/vector-writer:latest
    container_name: rt3u1-vector-writer
    environment:
      - RUST_LOG=info
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC=domain.analysis.events.v1
      - KAFKA_GROUP_ID=vector-writer-cg
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_COLLECTION=package_embeddings
      - QDRANT_DIMENSION=384
      - HEALTH_PORT=9092
    depends_on:
      redpanda:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9092/health/ready" ]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Syncer Service
  # ═══════════════════════════════════════════════════════════════
  syncer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.syncer
    image: realtime3u1/syncer:latest
    container_name: rt3u1-syncer
    environment:
      - RUST_LOG=info
      - RISINGWAVE_URL=postgres://root@risingwave:4566/dev
      - MEMGRAPH_URL=bolt://memgraph:7687
      - QDRANT_URL=http://qdrant:6334
      - HEALTH_PORT=9093
    depends_on:
      memgraph:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      risingwave:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9093/health/ready" ]
      interval: 15s
      timeout: 5s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Frontend
  # ═══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_GRAPHQL_ENDPOINT=${PUBLIC_GRAPHQL_ENDPOINT:-/graphql}
        - NEXT_PUBLIC_WS_ENDPOINT=${PUBLIC_WS_ENDPOINT:-/graphql/ws}
        - NEXT_PUBLIC_AGENT_STREAM_ENDPOINT=${PUBLIC_AGENT_STREAM_ENDPOINT:-/agent/stream}
        - NEXT_PUBLIC_SEARCH_MODE=${PUBLIC_SEARCH_MODE:-semantic}
    image: realtime3u1/frontend:latest
    container_name: rt3u1-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=${PUBLIC_GRAPHQL_ENDPOINT:-/graphql}
      - NEXT_PUBLIC_WS_ENDPOINT=${PUBLIC_WS_ENDPOINT:-/graphql/ws}
      - NEXT_PUBLIC_AGENT_STREAM_ENDPOINT=${PUBLIC_AGENT_STREAM_ENDPOINT:-/agent/stream}
      - NEXT_PUBLIC_SEARCH_MODE=${PUBLIC_SEARCH_MODE:-semantic}
    depends_on:
      - api
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ----------------------------------------------------------------
  # Edge Proxy (Caddy)
  # ----------------------------------------------------------------
  caddy:
    image: caddy:2.8.4-alpine
    container_name: rt3u1-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  # ═══════════════════════════════════════════════════════════════
  # Infrastructure Services
  # ═══════════════════════════════════════════════════════════════
  memgraph:
    image: memgraph/memgraph-mage:3.9.0
    container_name: rt3u1-memgraph
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
      - ../infra/memgraph/queries:/usr/lib/memgraph/query_modules:ro
    environment:
      - MEMGRAPH_QUERY_MODULES_DIRECTORY=/usr/lib/memgraph/query_modules
    healthcheck:
      test: [ "CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  postgres:
    image: postgres:17.9-alpine
    container_name: rt3u1-postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-idp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-idp_secret}
      - POSTGRES_DB=${POSTGRES_DB:-inverse_deps}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idp} -d ${POSTGRES_DB:-inverse_deps}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  redis:
    image: redis:8.6.0-alpine
    container_name: rt3u1-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: rt3u1-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: [ "CMD", "bash", "-lc", "cat < /dev/null > /dev/tcp/127.0.0.1/6333" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.5
    container_name: rt3u1-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${EXTERNAL_HOST:-localhost}:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://${EXTERNAL_HOST:-localhost}:18082
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:18082:18082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

  risingwave:
    image: risingwavelabs/risingwave:v2.8.1
    container_name: rt3u1-risingwave
    command: playground
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:5691:5691"
    volumes:
      - risingwave-data:/risingwave/state_store
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/4566' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging_defaults
    networks:
      - rt3u1-network

# ═══════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════
volumes:
  memgraph-data:
  postgres-data:
  redis-data:
  qdrant-data:
  redpanda-data:
  risingwave-data:
  caddy-data:
  caddy-config:

    # ═══════════════════════════════════════════════════════════════
    # Networks
    # ═══════════════════════════════════════════════════════════════
networks:
  rt3u1-network:
    driver: bridge
