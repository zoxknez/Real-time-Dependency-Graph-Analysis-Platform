apiVersion: v2
name: idp
description: Inverse Dependencies Platform - Real-time dependency graph analysis
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - dependency-analysis
  - security
  - supply-chain
  - graph-database
  - ai-agent
home: https://github.com/your-org/idp
sources:
  - https://github.com/your-org/idp
maintainers:
  - name: IDP Team
    email: team@idp.com
icon: https://idp.com/logo.png
dependencies:
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: kafka
    version: "26.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled

