{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idp.fullname" . }}-api
  labels:
    {{- include "idp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "idp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "idp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "idp.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: "{{ .Values.global.imageRegistry }}{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        {{- range .Values.api.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        - name: MEMGRAPH_URI
          value: "bolt://{{ include "idp.fullname" . }}-memgraph:7687"
        - name: REDIS_URL
          value: "redis://{{ include "idp.fullname" . }}-redis-master:6379"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "idp.fullname" . }}-postgres
              key: connection-string
        - name: KAFKA_BROKERS
          value: "{{ include "idp.fullname" . }}-kafka:9092"
        - name: QDRANT_URL
          value: "http://{{ include "idp.fullname" . }}-qdrant:6333"
        {{- if .Values.api.cache.enabled }}
        - name: CACHE_L1_MAX_SIZE
          value: {{ .Values.api.cache.l1MaxSize | quote }}
        - name: CACHE_L2_TTL
          value: {{ .Values.api.cache.l2Ttl | quote }}
        - name: CACHE_STRATEGY
          value: {{ .Values.api.cache.strategy | quote }}
        - name: CACHE_COMPRESSION
          value: {{ .Values.api.cache.compression | quote }}
        {{- end }}
        {{- if .Values.api.circuitBreaker.enabled }}
        - name: CIRCUIT_BREAKER_FAILURE_THRESHOLD
          value: {{ .Values.api.circuitBreaker.failureThreshold | quote }}
        - name: CIRCUIT_BREAKER_TIMEOUT
          value: {{ .Values.api.circuitBreaker.timeout | quote }}
        - name: CIRCUIT_BREAKER_SUCCESS_THRESHOLD
          value: {{ .Values.api.circuitBreaker.successThreshold | quote }}
        - name: CIRCUIT_BREAKER_MAX_CONCURRENT
          value: {{ .Values.api.circuitBreaker.maxConcurrent | quote }}
        {{- end }}
        {{- if .Values.api.streaming.enabled }}
        - name: STREAM_BATCH_SIZE
          value: {{ .Values.api.streaming.batchSize | quote }}
        - name: STREAM_MAX_ITEMS
          value: {{ .Values.api.streaming.maxItems | quote }}
        - name: STREAM_BUFFER_SIZE
          value: {{ .Values.api.streaming.bufferSize | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

