# Default values for IDP Platform
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  
  # Multi-region configuration
  multiRegion:
    enabled: false
    regions:
      - name: us-east-1
        primary: true
        endpoint: https://api-us.idp.com
      - name: eu-west-1
        primary: false
        endpoint: https://api-eu.idp.com

# API Gateway
api:
  enabled: true
  replicaCount: 3
  
  image:
    repository: idp/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
    hosts:
      - host: api.idp.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-tls
        hosts:
          - api.idp.com
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  env:
    - name: RUST_LOG
      value: "info,api=debug"
    - name: ENVIRONMENT
      value: "production"
    - name: RATE_LIMIT_RPM
      value: "1000"
    - name: MAX_COMPLEXITY
      value: "1000"
    - name: QUERY_TIMEOUT_SECS
      value: "30"
  
  # Advanced features configuration
  cache:
    enabled: true
    l1MaxSize: 10000
    l2Ttl: 300
    strategy: "WriteAround"
    compression: true
  
  circuitBreaker:
    enabled: true
    failureThreshold: 0.5
    timeout: 30
    successThreshold: 5
    maxConcurrent: 100
  
  streaming:
    enabled: true
    batchSize: 100
    maxItems: 10000
    bufferSize: 1000

# Ingestion Service
ingestion:
  enabled: true
  replicaCount: 2
  
  image:
    repository: idp/ingestion
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  
  env:
    - name: RUST_LOG
      value: "info,ingestion=debug"
    - name: CRAWLER_WORKERS
      value: "10"
    - name: BATCH_SIZE
      value: "100"

# Graph Writer
graphWriter:
  enabled: true
  replicaCount: 2
  
  image:
    repository: idp/graph-writer
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  
  env:
    - name: RUST_LOG
      value: "info,graph_writer=debug"
    - name: BATCH_SIZE
      value: "100"

# Vector Writer
vectorWriter:
  enabled: true
  replicaCount: 2
  
  image:
    repository: idp/vector-writer
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  
  env:
    - name: RUST_LOG
      value: "info,vector_writer=debug"

# Syncer
syncer:
  enabled: true
  replicaCount: 1
  
  image:
    repository: idp/syncer
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  
  env:
    - name: RUST_LOG
      value: "info,syncer=debug"

# Frontend
frontend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: idp/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: idp.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: frontend-tls
        hosts:
          - idp.com
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Redis (for caching and rate limiting)
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    password: "changeme"
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# PostgreSQL (for audit logs)
postgresql:
  enabled: true
  auth:
    username: idp
    password: "changeme"
    database: idp
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

# Kafka (for event streaming)
kafka:
  enabled: true
  replicaCount: 3
  auth:
    clientProtocol: plaintext
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  zookeeper:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      size: 8Gi

# Memgraph (graph database)
memgraph:
  enabled: true
  replicaCount: 1
  
  image:
    repository: memgraph/memgraph
    tag: "2.14.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 7687
  
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 16Gi
  
  env:
    - name: MEMGRAPH_LOG_LEVEL
      value: "INFO"

# Qdrant (vector database)
qdrant:
  enabled: true
  replicaCount: 1
  
  image:
    repository: qdrant/qdrant
    tag: "v1.7.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 6333
  
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# RisingWave (streaming SQL)
risingwave:
  enabled: true
  replicaCount: 1
  
  image:
    repository: risingwavelabs/risingwave
    tag: "v1.5.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 4566
  
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# Monitoring
monitoring:
  enabled: true
  
  prometheus:
    enabled: true
    retention: 15d
    storageSize: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi
  
  grafana:
    enabled: true
    adminPassword: "changeme"
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'cluster', 'service']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        receiver: 'slack'
      receivers:
        - name: 'slack'
          slack_configs:
            - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
              channel: '#alerts'
              title: 'IDP Platform Alert'

# Service Mesh (optional)
serviceMesh:
  enabled: false
  type: istio  # or linkerd

# Network Policies
networkPolicies:
  enabled: true

# Pod Security Policies
podSecurityPolicy:
  enabled: true

# RBAC
rbac:
  create: true

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

