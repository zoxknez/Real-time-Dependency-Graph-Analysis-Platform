global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'memgraph'
    static_configs:
      - targets: ['memgraph:7444']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  # Application services
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api:8081']

  - job_name: 'ingestion'
    static_configs:
      - targets: ['ingestion:9001']

  - job_name: 'graph-writer'
    static_configs:
      - targets: ['graph-writer:8081']

  - job_name: 'vector-writer'
    static_configs:
      - targets: ['vector-writer:9092']
