name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (e.g., v1.0.0 or SHA)'
        required: true
        default: 'latest'

  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  HELM_VERSION: "3.14.0"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Prepare Deployment
  # ═══════════════════════════════════════════════════════════════
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF#refs/tags/}" == *"-rc"* ]] || [[ "${GITHUB_REF#refs/tags/}" == *"-beta"* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════════
  # Deploy to Kubernetes
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to ${{ needs.prepare.outputs.environment }}
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Create namespace if not exists
        run: |
          kubectl create namespace idp-${{ needs.prepare.outputs.environment }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace idp-${{ needs.prepare.outputs.environment }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install idp ./deploy/helm/idp \
            --namespace idp-${{ needs.prepare.outputs.environment }} \
            --set global.image.tag=${{ needs.prepare.outputs.version }} \
            --set global.image.registry=${{ env.REGISTRY }}/${{ github.repository }} \
            --set global.environment=${{ needs.prepare.outputs.environment }} \
            --values ./deploy/helm/idp/values-${{ needs.prepare.outputs.environment }}.yaml \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/idp-api \
            --namespace idp-${{ needs.prepare.outputs.environment }} \
            --timeout=5m
          kubectl rollout status deployment/idp-frontend \
            --namespace idp-${{ needs.prepare.outputs.environment }} \
            --timeout=5m

      - name: Get deployment info
        run: |
          echo "=== Pods ==="
          kubectl get pods -n idp-${{ needs.prepare.outputs.environment }}
          echo "=== Services ==="
          kubectl get svc -n idp-${{ needs.prepare.outputs.environment }}
          echo "=== Ingress ==="
          kubectl get ingress -n idp-${{ needs.prepare.outputs.environment }}

  # ═══════════════════════════════════════════════════════════════
  # Smoke Tests
  # ═══════════════════════════════════════════════════════════════
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Get service URL
        id: url
        run: |
          if [ "${{ needs.prepare.outputs.environment }}" == "production" ]; then
            echo "url=https://api.idp.example.com" >> $GITHUB_OUTPUT
          else
            echo "url=https://api.staging.idp.example.com" >> $GITHUB_OUTPUT
          fi

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf "${{ steps.url.outputs.url }}/health" > /dev/null; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "Waiting for API to be ready... ($i/30)"
            sleep 10
          done
          echo "❌ API health check failed"
          exit 1

      - name: GraphQL introspection check
        run: |
          RESULT=$(curl -sf -X POST "${{ steps.url.outputs.url }}/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __schema { types { name } } }"}')
          if echo "$RESULT" | grep -q "__schema"; then
            echo "✅ GraphQL schema is accessible"
          else
            echo "❌ GraphQL introspection failed"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════
  # Notify
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [prepare, deploy, smoke-test]
    if: always()
    steps:
      - name: Deployment success notification
        if: ${{ needs.deploy.result == 'success' && needs.smoke-test.result == 'success' }}
        run: |
          echo "🚀 Deployment to ${{ needs.prepare.outputs.environment }} successful!"
          echo "Version: ${{ needs.prepare.outputs.version }}"

      - name: Deployment failure notification
        if: ${{ needs.deploy.result == 'failure' || needs.smoke-test.result == 'failure' }}
        run: |
          echo "❌ Deployment to ${{ needs.prepare.outputs.environment }} failed!"
          exit 1
